name: Daily Digest

on:
  # Generation (the LLM part) runs on the Mac with the Codex CLI via launchd
  # (scripts/run-local.sh), which commits data/YYYY-MM-DD.json to main. This
  # workflow only builds the static site from data/ and deploys it — no API
  # key needed.
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'public/**'
      - 'scripts/build-site.js'
      - '.github/workflows/daily.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; never cancel an in-flight deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build and deploy are separate jobs (the layout GitHub's Pages starter
  # workflow uses): on 2026-11-24 deploy-pages, run as the next step in the
  # same job, twice found "0 artifacts" right after the upload finalized.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: node scripts/build-site.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
